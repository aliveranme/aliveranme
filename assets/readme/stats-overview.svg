<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">aliveranme GitHub overview stats</title>
  <desc id="desc">A light pastel local stats card showing public repositories, total stars, followers, following, and top programming languages.</desc>
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#FDF8F4"/>

  <!-- stat cards -->
  <g transform="translate(60, 44)">
    <g id="stat-repos">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">15</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Public Repos</text>
    </g>

    <g id="stat-stars" transform="translate(280, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">276</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Total Stars</text>
    </g>

    <g id="stat-followers" transform="translate(560, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">3</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Followers</text>
    </g>

    <g id="stat-following" transform="translate(840, 0)">
      <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1.5"/>
      <text class="sans" x="30" y="58" font-size="48" font-weight="700" fill="#3C4F66">1</text>
      <text class="sans" x="30" y="92" font-size="16" fill="#8A9CAD">Following</text>
    </g>
  </g>

  <!-- language bars -->
  <g transform="translate(60, 220)">
    <text class="sans" font-size="24" font-weight="700" fill="#3C4F66">Top Languages</text>
  </g>

  <g transform="translate(60, 270)" class="sans" font-size="18">
    <!-- Rust 39% -->
    <text x="0" y="20" fill="#6F7F90">Rust</text>
    <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
    <rect x="150" y="0" width="281" height="28" rx="6" fill="#dea584"/>
    <text x="890" y="20" fill="#3C4F66" font-weight="600">39%</text>

    <!-- PHP 26% -->
    <g transform="translate(0, 44)">
      <text x="0" y="20" fill="#6F7F90">PHP</text>
      <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
      <rect x="150" y="0" width="187" height="28" rx="6" fill="#4F5D95"/>
      <text x="890" y="20" fill="#3C4F66" font-weight="600">26%</text>
    </g>

    <!-- TypeScript 20% -->
    <g transform="translate(0, 88)">
      <text x="0" y="20" fill="#6F7F90">TypeScript</text>
      <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
      <rect x="150" y="0" width="144" height="28" rx="6" fill="#3178c6"/>
      <text x="890" y="20" fill="#3C4F66" font-weight="600">20%</text>
    </g>

    <!-- JavaScript 4% -->
    <g transform="translate(0, 132)">
      <text x="0" y="20" fill="#6F7F90">JavaScript</text>
      <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
      <rect x="150" y="0" width="29" height="28" rx="6" fill="#f1e05a"/>
      <text x="890" y="20" fill="#3C4F66" font-weight="600">4%</text>
    </g>

    <!-- CSS 4% -->
    <g transform="translate(0, 176)">
      <text x="0" y="20" fill="#6F7F90">CSS</text>
      <rect x="150" y="0" width="720" height="28" rx="6" fill="#E9EDF2"/>
      <rect x="150" y="0" width="29" height="28" rx="6" fill="#563d7c"/>
      <text x="890" y="20" fill="#3C4F66" font-weight="600">4%</text>
    </g>
  </g>
</svg>
